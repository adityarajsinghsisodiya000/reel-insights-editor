services:
  - type: worker
    name: reel-insights-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: FIREBASE_CRED_PATH
        value: serviceAccountKey.json
